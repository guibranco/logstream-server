name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time: a new run waits for the in-progress one to finish
# instead of cancelling it. GitHub keeps at most one pending run per group, so
# if several pushes queue up, only the latest is deployed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  # ── 1. Unit tests ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: sockets, pcntl, pdo_mysql, zip
          coverage: pcov

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Install dependencies
        run: composer install --no-interaction --no-progress

      - name: 🧪 Run unit tests
        run: vendor/bin/phpunit --testdox --testsuite unit --coverage-clover=coverage.xml

      - name: 📊 SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 2. Integration tests ──────────────────────────────────────────────────────
  integration_tests:
    name: 🔌 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐳 Build and start containers
        run: API_SECRET=test-secret UI_SECRET=test-ui-secret STORAGE_TYPE=file docker compose up -d --build

      - name: 🔧 Make scripts executable
        run: |
          chmod +x Tools/wait-for-healthy.sh
          chmod +x tests/endpoint-tests.sh

      - name: ⏳ Wait for all containers to be healthy
        run: Tools/wait-for-healthy.sh 120

      - name: 🔌 Run HTTP endpoint tests
        run: tests/endpoint-tests.sh http://localhost:8081 test-secret test-ui-secret

      - name: 📋 Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: 🛑 Stop containers
        if: always()
        run: docker compose down -v

  # ── 3. Determine version ──────────────────────────────────────────────────────
  version:
    name: 🏷️ Determine Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration_tests]
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine version number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

  # ── 4. Database migrations (via WireGuard) ────────────────────────────────────
  # Runs before the deploy so the new code always finds the schema it expects.
  # db-migration.sh tracks applied files in schema_versions, so re-runs are no-ops.
  database_migrations:
    name: 🗄️ Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    needs: [integration_tests]
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔐 Acquire WireGuard connection lock
        uses: guibranco/github-artifact-lock-action@6d965a4d06be6a2a8e0aa5583745696c5f23ab46 # v3.0.24
        with:
          lock-name: wireguard-connection

      - name: 🔌 Establish WireGuard VPN connection
        timeout-minutes: 5
        shell: bash
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          echo "WIREGUARD_CONNECTED=true" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard wireguard-tools resolvconf
          # Ubuntu 26's AppArmor profile only lets wg-quick read /etc/wireguard
          # Strip a UTF-8 BOM and CRs in case the secret was saved from Windows
          printf '%s\n' "$WIREGUARD_CONFIG" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' \
            | sudo install -m 600 /dev/stdin /etc/wireguard/wg0.conf
          # Print the config structure (keys only, never values) to help debug parsing errors
          echo "wg0.conf: $(sudo wc -l < /etc/wireguard/wg0.conf) lines"
          sudo sed -E 's/^([A-Za-z]+)[[:space:]]*=.*/\1 = …/' /etc/wireguard/wg0.conf | grep -E '^[A-Za-z]+ = …$|^$' || true
          sudo modprobe wireguard
          sudo wg-quick up wg0

      - name: 🔄 Apply database migrations
        timeout-minutes: 10
        env:
          MYSQL_PWD: ${{ secrets.MARIADB_MIGRATION_PASSWORD }}
          DB_HOST: ${{ secrets.MARIADB_HOST }}
          DB_USER: ${{ secrets.MARIADB_MIGRATION_USER }}
          DB_NAME: ${{ secrets.MARIADB_DATABASE }}
        run: bash Tools/db-migration.sh migrations "$DB_HOST" "$DB_USER" "$DB_NAME"

      - name: 🔌 Disconnect WireGuard VPN
        if: always() && env.WIREGUARD_CONNECTED == 'true'
        shell: bash
        run: |
          if ip link show wg0 >/dev/null 2>&1; then sudo wg-quick down wg0; fi
          sudo rm -f /etc/wireguard/wg0.conf

      - name: 🔓 Release WireGuard connection lock
        if: always()
        uses: guibranco/github-artifact-lock-action/release-lock@6d965a4d06be6a2a8e0aa5583745696c5f23ab46 # v3.0.24
        with:
          lock-name: wireguard-connection

  # ── 5. Deploy via SSH ─────────────────────────────────────────────────────────
  # Pulls the code, regenerates .env from secrets (runtime DB user) and
  # restarts the systemd service.
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, database_migrations]
    environment: production

    steps:
      - name: 🔑 Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          # Strip a UTF-8 BOM and CRs in case the secret was saved from Windows;
          # either one makes OpenSSH fail with "error in libcrypto".
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail early with a clear message if the key still can't be parsed
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "❌ SSH_PRIVATE_KEY is not a valid private key"; exit 1; }
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: 📥 Pull latest code and install dependencies
        run: |
          ssh server bash -s << 'ENDSSH'
            set -euo pipefail
            cd /opt/logstream-server
            sudo -u logstream git fetch --quiet origin main
            sudo -u logstream git reset --hard --quiet origin/main
            sudo -u logstream composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --no-progress
            sudo -u logstream mkdir -p storage/logs
            test -d public || { echo "❌ public/ directory is missing"; exit 1; }
          ENDSSH

      - name: 📝 Generate .env from secrets
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          UI_SECRET: ${{ secrets.UI_SECRET }}
          APP_VERSION: ${{ needs.version.outputs.fullSemVer }}
          DB_HOST: ${{ secrets.MARIADB_HOST }}
          DB_NAME: ${{ secrets.MARIADB_DATABASE }}
          DB_USER: ${{ secrets.MARIADB_USER }}
          DB_PASS: ${{ secrets.MARIADB_PASSWORD }}
          # Nginx on the same host proxies every request, so without this all
          # entries record sender_ip=127.0.0.1. Override with the repository
          # variable TRUSTED_PROXIES if the proxy topology changes (e.g. a CDN).
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES || '127.0.0.1,::1' }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          HTTP_PORT=8081
          WS_PORT=8080
          API_SECRET=$API_SECRET
          UI_SECRET=$UI_SECRET
          APP_VERSION=$APP_VERSION
          TRUSTED_PROXIES=$TRUSTED_PROXIES
          RETENTION_CONFIG=./retention.production.json
          STORAGE_TYPE=mariadb
          LOG_PATH=./storage/logs
          DB_HOST=$DB_HOST
          DB_PORT=3306
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASS=$DB_PASS
          EOF
          ssh server 'sudo install -o logstream -g logstream -m 640 /dev/stdin /opt/logstream-server/.env' < .env.deploy
          rm -f .env.deploy

      - name: ♻️ Restart service and wait for health
        run: |
          ssh server bash -s << 'ENDSSH'
            set -euo pipefail
            sudo systemctl restart logstream-server
            for i in $(seq 1 20); do
              HTTP=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8081/api/health || echo "000")
              if [[ "$HTTP" == "200" ]]; then
                echo "✅ Service is healthy (attempt $i)"
                exit 0
              fi
              echo "   Attempt $i — HTTP $HTTP, retrying in 3s..."
              sleep 3
            done
            echo "❌ Service did not become healthy in time"
            sudo journalctl -u logstream-server -n 50 --no-pager
            exit 1
          ENDSSH

      - name: 🔍 Verify public endpoint
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" "$HEALTH_CHECK_URL/api/health")
          if [[ "$HTTP" == "200" ]]; then
            echo "✅ $HEALTH_CHECK_URL is reachable"
          else
            echo "❌ $HEALTH_CHECK_URL/api/health returned HTTP $HTTP"
            exit 1
          fi

      - name: 🧹 Remove private key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ── 6. GitHub Release ─────────────────────────────────────────────────────────
  create_release:
    name: 📢 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    needs: [version, deploy]

    steps:
      - name: 🏷️ Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          skipIfReleaseExists: true
          allowUpdates: false
          draft: false
          makeLatest: true
          tag: v${{ needs.version.outputs.fullSemVer }}
          name: Release v${{ needs.version.outputs.fullSemVer }}
          generateReleaseNotes: true
          body: |
            ## logstream-server v${{ needs.version.outputs.fullSemVer }}
            Built from `${{ github.sha }}`
