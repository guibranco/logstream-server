services:

  # ── Application ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"   # HTTP API
      - "8080:8080"   # WebSocket
      - "8082:8082/udp" # UDP ingest (HMAC-signed packets)
    environment:
      HTTP_PORT:    8081
      WS_PORT:      8080
      UDP_ENABLED:  ${UDP_ENABLED:-true}
      UDP_PORT:     8082
      API_SECRET:   ${API_SECRET:-test-secret}
      UI_SECRET:    ${UI_SECRET:-test-ui-secret}
      API_SECRET_PREFIX: ${API_SECRET_PREFIX-lsa_}
      UI_SECRET_PREFIX:  ${UI_SECRET_PREFIX-lsu_}
      APP_TOKEN_PREFIX:  ${APP_TOKEN_PREFIX-lss_}
      STORAGE_TYPE: ${STORAGE_TYPE:-mariadb}
      LOG_STORE:    ${LOG_STORE:-}
      CLICKHOUSE_URL:      ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-logstream}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER:-logstream}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-test}
      INGEST_MODE:  ${INGEST_MODE:-buffered}
      DB_DRIVER:    ${DB_DRIVER:-async}
      SELF_LOG_ENABLED: ${SELF_LOG_ENABLED:-true}
      SELF_LOG_LEVEL:   ${SELF_LOG_LEVEL:-info}
      SELF_LOG_HTTP_ERRORS: ${SELF_LOG_HTTP_ERRORS:-true}
      DB_HOST:      db
      DB_PORT:      3306
      DB_NAME:      logservice
      DB_USER:      logservice
      DB_PASS:      test
      LOG_PATH:     /app/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-fsS", "http://localhost:8081/api/health"]
      interval:     5s
      timeout:      3s
      start_period: 15s
      retries:      10
    restart: unless-stopped

  # ── MariaDB ──────────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE:      logservice
      MARIADB_USER:          logservice
      MARIADB_PASSWORD:      test
    volumes:
      - db_data:/var/lib/mysql
      # Automatically apply the migration on first run
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:         ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval:     5s
      timeout:      3s
      start_period: 30s
      retries:      10

  # ── ClickHouse (optional log store) ──────────────────────────────────────────
  # docker compose --profile clickhouse up -d clickhouse
  # CLICKHOUSE_URL=http://127.0.0.1:8123 CLICKHOUSE_USER=logstream CLICKHOUSE_PASSWORD=test \
  #   bash Tools/clickhouse-migration.sh
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_DB:       logstream
      CLICKHOUSE_USER:     logstream
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-test}
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, local only
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/config.d/logstream.xml:/etc/clickhouse-server/config.d/logstream.xml:ro
      - ./docker/clickhouse/users.d/logstream.xml:/etc/clickhouse-server/users.d/logstream.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:         ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval:     5s
      timeout:      3s
      start_period: 20s
      retries:      10

volumes:
  db_data:
  clickhouse_data:
